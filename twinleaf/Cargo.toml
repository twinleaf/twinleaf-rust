[package]
name = "twinleaf"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Library for working with the Twinleaf I/O protocol and Twinleaf quantum sensors."
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "sensor", "protocol", "quantum", "daq"]
categories = ["hardware-support", "science"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(shuttle)", "cfg(turmoil)", "cfg(tokio_unstable)"] }

[lints.clippy]
self_named_module_files = "deny"

[features]
default = ["host", "serial", "firmware-update", "hdf5"]
# Everything that talks to a device or the operating system: connections,
# the proxy, sessions, firmware, and memory-mapped log files. Without it the
# crate is the packet codec and the data layer, which build for wasm32.
host = [
  "dep:tokio", "dep:tokio-util", "dep:tokio-stream", "dep:futures-util", "dep:flume",
  "dep:minicbor", "dep:crc", "dep:directories", "dep:socket2", "dep:memmap2",
]
serial = ["host", "dep:tokio-serial", "dep:serialport"]
hdf5 = ["dep:hdf5-pure"]
# Built-in GitHub-backed firmware catalog (pulls in an HTTP client + TLS).
# The core firmware plumbing (types, update check, flashing) is always
# available; this feature only adds `firmware::github`.
firmware-update = ["host", "dep:ureq", "dep:serde_json"]
# `RpcValue::to_json`, the JSON a host writes a value as.
json = ["host", "dep:serde_json"]
# mDNS/DNS-SD discovery of networked devices advertising `_twinleaf._tcp`,
# and mDNS resolution of `.local` host names.
mdns = ["host", "dep:mdns-sd", "dep:if-addrs"]
# Signal processing ops over a column: decimation and spectral estimates.
processing = ["dep:rustfft"]

[dependencies]
bytes = "1"
twinleaf-proto = { version = "0.1", path = "../twinleaf-proto" }
twinleaf-device = { version = "0.1", path = "../twinleaf-device" }
crc = { version = "3.2", optional = true }
num_enum = "0.7"
glob = "0.3"
log = "0.4"
memmap2 = { version = "0.9", optional = true }
hdf5-pure = { version = "=0.47.0", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
mdns-sd = { version = "0.21", optional = true }
if-addrs = { version = "0.15", optional = true }
directories = { version = "6.0", optional = true }
thiserror = "2"
tokio-serial = { version = "5.5", optional = true }
serialport = { version = "4.9", optional = true }
socket2 = { version = "0.6.5", optional = true }
rustfft = { version = "6.4.1", optional = true }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process"], optional = true }
tokio-util = { version = "0.7", features = ["rt", "codec", "net", "join-map"], optional = true }
tokio-stream = { version = "0.1", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }
flume = { version = "0.12", default-features = false, features = ["async", "select", "eventual-fairness"], optional = true }
minicbor = { version = "2.3", features = ["derive", "std"], optional = true }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = "1"
proptest-state-machine = "0.9"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
tokio = { version = "1.47", features = ["test-util"] }

# The test backends of `src/seam`, which `cargo test-shuttle` and
# `cargo test-turmoil` build.
[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.9.9"
shuttle-tokio = { version = "1.0.0", features = ["shuttle", "rt", "sync", "time"] }

# The turmoil tests record turmoil's network events through `tracing`, which
# turmoil already depends on, to check that a scenario replays from its seed.
[target.'cfg(turmoil)'.dev-dependencies]
turmoil = "0.7.2"
tracing = "0.1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_Devices_Communication",
  "Win32_System_Power",
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_Console"
] }
