[package]
name = "twinleaf"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Library for working with the Twinleaf I/O protocol and Twinleaf quantum sensors."
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "sensor", "protocol", "quantum", "daq"]
categories = ["hardware-support", "science"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[features]
default = ["serial", "firmware-update"]
serial = ["dep:tokio-serial", "dep:serialport"]
hdf5 = ["dep:hdf5", "dep:hdf5-sys"]
# Built-in GitHub-backed firmware catalog (pulls in an HTTP client + TLS).
# The core firmware plumbing (types, update check, flashing) is always
# available; this feature only adds `firmware::github`.
firmware-update = ["dep:ureq", "dep:serde_json"]
# mDNS/DNS-SD discovery of networked devices advertising `_twinleaf._tcp`,
# and mDNS resolution of `.local` host names.
mdns = ["dep:mdns-sd"]
# Signal processing ops over a column: decimation and spectral estimates.
processing = ["dep:rustfft"]

[dependencies]
bytes = "1"
twinleaf-proto = { version = "0.1", path = "../twinleaf-proto" }
crc = "3.2"
num_enum = "0.7"
glob = "0.3"
log = "0.4"
memmap2 = "0.9"
hdf5 = { package = "hdf5-metno", version = "0.12", features = ["static", "zlib", "blosc"], optional = true}
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11", optional = true }
ureq = { version = "3", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
mdns-sd = { version = "0.21", optional = true }
directories = "6.0"
thiserror = "2"
tokio-serial = { version = "5.5", optional = true }
serialport = { version = "4.9", optional = true }
socket2 = "0.6.5"
rustfft = { version = "6.4.1", optional = true }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt", "codec", "net", "join-map"] }
tokio-stream = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
flume = { version = "0.12", default-features = false, features = ["async", "select", "eventual-fairness"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_Devices_Communication",
  "Win32_System_Power",
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_Console"
] }
