[package]
name = "twinleaf-data"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Samples decoded from Twinleaf I/O packets, with their batches, history, statistics and files."
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "sensor", "protocol", "daq"]
categories = ["science", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
self_named_module_files = "deny"

[features]
default = []
hdf5 = ["dep:hdf5-pure"]
processing = ["dep:rustfft"]
# `fixtures`, for tests of code that uses this crate.
test-util = []

[dependencies]
twinleaf-proto = { version = "0.1", path = "../twinleaf-proto" }
bytes = "1"
glob = "0.3"
log = "0.4"
thiserror = "2"
hdf5-pure = { version = "=0.47.0", optional = true }
rustfft = { version = "6.4.1", optional = true }

# Memory-mapped log files, which need an operating system.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
proptest = "1"
tempfile = "3"
