[package]
name = "twinleaf-proto"
version = "0.1.0"
edition = "2021"
description = "Shared no_std wire types for the Twinleaf I/O protocol"
license = "MIT"
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "protocol", "no-std", "sensor"]
categories = ["embedded", "no-std", "encoding"]

[dependencies]
crc = "3.4"
thiserror = { version = "2", default-features = false }
defmt = { version = "1.1", optional = true }

[features]
default = []
defmt = ["dep:defmt"]
