[package]
name = "twinleaf-tools"
version = "2.4.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Tools for the Twinleaf I/O protocol for reading data from Twinleaf quantum sensors."
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "sensor", "cli", "tio", "quantum"]
categories = ["command-line-utilities", "hardware-support", "science"]

[lints.clippy]
self_named_module_files = "deny"

[features]
default = ["serial", "mdns", "hdf5", "web"]
serial = ["dep:serialport", "twinleaf/serial"]
mdns = ["twinleaf/mdns", "dep:gethostname", "dep:mdns-sd"]
hdf5 = ["twinleaf/hdf5", "twinleaf-web?/hdf5"]
# The web page of `tio proxy`, at http://localhost:7855, and `tio mcp`, which
# bridges an MCP host's stdio to the page's MCP endpoint.
web = ["dep:twinleaf-web", "dep:rmcp", "dep:reqwest", "dep:tokio"]

[[bench]]
name = "log_workflows"
harness = false
required-features = ["hdf5"]

[dependencies]
bytes = "1"
ctrlc = { version = "3.5", features = ["termination"] }
serialport = { version = "4.5", optional = true }
toml_edit = {version = "0.25", features = ["parse"]}
twinleaf = { version = "2.0.1", path = "../twinleaf", default-features = false, features = ["firmware-update", "json", "processing"] }
twinleaf-device = { version = "0.1", path = "../twinleaf-device", features = ["sim"] }
twinleaf-web = { version = "0.1", path = "../twinleaf-web", optional = true }
# `tio mcp`: the SDK's stdio transport, which serves the host as a server
# does, and its Streamable HTTP client, which
# reaches the hub over plain HTTP on loopback, so with no TLS.
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest"], optional = true }
# `tio mcp` asks the hub whether its MCP endpoint is on before it bridges.
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
tokio = { version = "1.47", features = ["rt", "net", "io-std", "macros"], optional = true }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
tui-prompts = "0.6"
indicatif = "0.18"
console = "0.16"
chrono = "0.4"
clap_complete = "4.5"
eyre = "0.6"
glob = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
color-eyre = "0.6"
termtree = "1"
nucleo-matcher = "0.3"
humantime = "2.2"
log = "0.4"
env_logger = "0.11"
indicatif-log-bridge = "0.2"
dialoguer = "0.12"
gethostname = { version = "1", optional = true }
mdns-sd = { version = "0.21", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
