name: Rust

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Main takes pull requests from dev only
        run: test "${{ github.head_ref }}" = dev

  build:
    strategy:
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - name: Build
        run: cargo build --all --release --verbose
      - name: Test
        run: cargo test --workspace
      - name: Lint
        if: matrix.platform == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets
      - name: Lint and test under shuttle's schedulers
        if: matrix.platform == 'ubuntu-latest'
        env:
          RUSTFLAGS: --cfg shuttle
        run: |
          cargo clippy -p twinleaf --lib --tests --target-dir target/shuttle
          cargo test -p twinleaf --lib --target-dir target/shuttle shuttle
      - name: Lint and test over turmoil's simulated network
        if: matrix.platform == 'ubuntu-latest'
        env:
          RUSTFLAGS: --cfg turmoil
        run: |
          cargo clippy -p twinleaf --lib --tests --target-dir target/turmoil
          cargo test -p twinleaf --lib --target-dir target/turmoil turmoil
      - name: Strip binaries
        if: matrix.platform != 'windows-latest'
        run: |
          strip target/release/tio
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: twinleaf-tools.${{ matrix.platform }}
          path: |
            target/release/tio
            target/release/tio.exe
