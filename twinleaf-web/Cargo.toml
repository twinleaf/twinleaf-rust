[package]
name = "twinleaf-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "The web page of the Twinleaf proxy: live plots of a device's data in a browser."
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
publish = false
# The built page goes in the published crate, so installing that needs no Node.
# A release build of a checkout without the built page builds it, in build.rs.
include = ["src/**", "ui/dist/**", "build.rs", "Cargo.toml"]

[lints.clippy]
self_named_module_files = "deny"

[dependencies]
twinleaf = { version = "2.0", path = "../twinleaf", default-features = false, features = ["host", "json", "processing", "firmware-update"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
futures-util = { version = "0.3", default-features = false }

[features]
# Exports the history as HDF5 as well as CSV.
hdf5 = ["twinleaf/hdf5"]

[dev-dependencies]
# The simulated device the hub's capture tests read.
twinleaf-tools = { path = "../twinleaf-tools", default-features = false }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.47", features = ["rt", "macros"] }
proptest = "1"
