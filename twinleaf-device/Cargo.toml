[package]
name = "twinleaf-device"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Device-side behavior for the Twinleaf I/O protocol, without an executor"
homepage = "https://twinleaf.com"
repository = "https://github.com/twinleaf/twinleaf-rust"
readme = "README.md"
keywords = ["twinleaf", "protocol", "no-std", "sensor", "firmware"]
categories = ["embedded", "no-std"]

[dependencies]
heapless = "0.9"
twinleaf-proto = { version = "0.1", path = "../twinleaf-proto" }
